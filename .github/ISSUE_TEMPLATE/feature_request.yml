name: Feature request
description: A change to the public product, not a security report
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Continuity is a local control plane, not a hosted coding agent. Requests that need npm publish, telemetry, or a marketplace listing will be closed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or ambiguous for a Git repository operator?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: What this is not
      description: Optional. Git replacement, issue tracker, secret store, daemon, or automatic proof of correctness are out of scope.
