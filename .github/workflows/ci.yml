name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: protocol
        run: npm run test:protocol
      - name: coordinator
        run: npm run test:coordinator
      - name: Combined check
        run: npm run check
      - name: memory install smoke
        run: node continuity/scripts/smokes/memory.mjs
      - name: coordinator install smoke
        run: node continuity/scripts/smokes/coordinator.mjs
      - name: full install smoke
        run: node continuity/scripts/smokes/full.mjs
      - name: Audit development tooling
        run: npm run audit:dev
